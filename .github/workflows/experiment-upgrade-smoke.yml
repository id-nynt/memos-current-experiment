name: Experiment upgrade-smoke

on:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: false
        default: ""
      previous_image:
        description: "Optional upgrade baseline; empty preserves stable-tag discovery"
        type: string
        required: false
        default: ""

concurrency:
  # Keep this distinct from a caller's concurrency group when the workflow is
  # invoked from release.yml; sharing a group with cancel-in-progress would
  # cancel the parent release workflow.
  group: ${{ github.workflow }}-upgrade-smoke-${{ github.ref }}-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: ${{ inputs.release_sha == '' }}

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.1"

jobs:
  migration-upgrade:
    name: Upgrade from previous stable (${{ matrix.driver }})
    runs-on: [self-hosted, linux, memos-bdi-deploy]
    strategy:
      fail-fast: false
      matrix:
        driver: [sqlite, mysql, postgres]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Test release versioning and installer
        run: go test -v ./scripts/...

      # No -race here: testcontainers has known races in its reaper, which is why
      # store/test/migrator_test.go documents skipping the race detector.
      - name: Run migration and upgrade tests
        run: |
          go test -v -timeout 30m -run 'TestMigration|TestUpgrade|TestFreshInstall' ./store/test/...
        env:
          DRIVER: ${{ matrix.driver }}

  release-smoke:
    name: Fresh install and upgrade through the release image
    runs-on: [self-hosted, linux, memos-bdi-deploy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          # release_smoke_test.sh resolves the previous stable release from Git
          # tags, so it needs full history and tags.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Checkout selected control for frozen identities
        if: inputs.release_sha != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: experiment-control
          persist-credentials: false

      - name: Resolve retained experiment candidate
        if: inputs.release_sha != ''
        id: frozen
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path('experiment-control')
          conventional = (root/'scripts/local-cd/frozen-releases.json').exists()
          manifest = root/('scripts/local-cd/frozen-releases.json' if conventional else 'experiment/frozen-releases.json')
          sys.path.insert(0, str(root/('scripts/experiment-measurement' if conventional else 'experiment/scripts')))
          import image_identity
          releases = json.loads(manifest.read_text())['releases']
          matches = [r for r in releases.values() if r['application_sha'] == os.environ['RELEASE_SHA']]
          if len(matches) != 1:
              raise ValueError('Smoke source is not the frozen application pair')
          identity = image_identity.resolve(matches[0])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=' + identity['runtime_image_id'] + '\n')
          print(json.dumps(identity))
          PY

      - name: Run release smoke test
        env:
          MEMOS_SMOKE_PREVIOUS_IMAGE: ${{ inputs.previous_image }}
          MEMOS_SMOKE_CANDIDATE_IMAGE: ${{ steps.frozen.outputs.image }}
        run: ./scripts/release_smoke_test.sh

  entrypoint:
    name: Entrypoint secret handling
    runs-on: [self-hosted, linux, memos-bdi-deploy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Run entrypoint tests
        run: ./scripts/entrypoint_test.sh

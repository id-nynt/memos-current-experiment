name: Frozen Memos experiment CD
run-name: conventional-${{ inputs.trial_id }}
on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        options: [v1, v2]
        required: true
      trial_id:
        type: string
        required: true
      scenario:
        type: string
        default: S0
        required: true
permissions:
  contents: read
concurrency:
  group: memos-local-cd
  cancel-in-progress: false
jobs:
  release:
    runs-on: [self-hosted, linux, memos-bdi-deploy]
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - id: release
        env:
          RELEASE: ${{ inputs.release }}
          TRIAL_ID: ${{ inputs.trial_id }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          python3 - <<'PY'
          import json, os, re
          assert re.fullmatch(r'[A-Za-z0-9_.-]+', os.environ['TRIAL_ID'])
          scenarios = json.load(open('experiment/scenarios.json'))
          assert scenarios[os.environ['SCENARIO']]['enabled'], 'Scenario not approved/enabled'
          assert os.environ['SCENARIO'] == 'S0' or os.environ['RELEASE'] == 'v2'
          release = json.load(open('scripts/local-cd/frozen-releases.json'))['releases'][os.environ['RELEASE']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + release['application_sha'] + '\n')
          PY
  backend:
    needs: release
    uses: ./.github/workflows/experiment-backend-tests.yml
    with:
      release_sha: ${{ needs.release.outputs.sha }}
  frontend:
    needs: release
    uses: ./.github/workflows/experiment-frontend-tests.yml
    with:
      release_sha: ${{ needs.release.outputs.sha }}
  proto:
    needs: release
    uses: ./.github/workflows/experiment-proto-linter.yml
    with:
      release_sha: ${{ needs.release.outputs.sha }}
  fixture:
    needs: [release, backend, frontend, proto]
    runs-on: [self-hosted, linux, memos-bdi-deploy]
    steps:
      - uses: actions/checkout@v6
      - name: Explicit deterministic CI fixture
        env:
          SCENARIO: ${{ inputs.scenario }}
          TRIAL_ID: ${{ inputs.trial_id }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: python3 experiment/fixture.py --scenario "$SCENARIO" --boundary ci --receipt fault-events.jsonl
      - name: Measure transient dependency
        id: s6
        if: inputs.scenario == 'S6' || inputs.scenario == 'CI01'
        env:
          SCENARIO: ${{ inputs.scenario }}
          TRIAL_ID: ${{ inputs.trial_id }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: python3 experiment/s6_fixture.py
      - name: Fail the test on the observed unavailable dependency
        if: steps.s6.outputs.result == 'transient_failure'
        run: exit 42
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        if: always()
        with:
          name: fixture-${{ inputs.trial_id }}
          path: |
            fault-events.jsonl
            ci-control.json
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        if: always() && (inputs.scenario == 'S6' || inputs.scenario == 'CI01')
        with:
          name: s6-fixture-${{ inputs.trial_id }}
          path: s6-evidence/
          if-no-files-found: error
  upgrade:
    needs: [release, fixture]
    uses: ./.github/workflows/experiment-upgrade-smoke.yml
    with:
      release_sha: ${{ needs.release.outputs.sha }}
      previous_image: neosmemo/memos@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
  deploy:
    needs: [release, upgrade]
    runs-on: [self-hosted, linux, memos-bdi-deploy]
    timeout-minutes: 60
    env:
      RELEASE: ${{ inputs.release }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      TRIAL_ID: ${{ inputs.trial_id }}
      SCENARIO: ${{ inputs.scenario }}
      MEMOS_EXPERIMENT_ROOT: ${{ vars.MEMOS_EXPERIMENT_ROOT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Explicit permanent build control
        shell: bash
        run: |
          python3 experiment/fixture.py --scenario "$SCENARIO" --boundary build --receipt fault-events.jsonl
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        if: always() && inputs.scenario == 'CI02'
        with:
          name: build-control-${{ inputs.trial_id }}
          path: ci-control.json
          if-no-files-found: error
      - name: Deliver frozen image through conventional stages
        shell: bash
        run: |
          python3 experiment/runtime_fixture.py
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        if: always()
        with:
          name: frozen-cd-${{ inputs.trial_id }}
          path: ${{ runner.temp }}/memos-local-cd-report/${{ github.run_id }}-${{ github.run_attempt }}/*
          retention-days: 90

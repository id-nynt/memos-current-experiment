name: Proto Linter

on:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "proto/**"

concurrency:
  group: ${{ github.workflow }}-proto-linter-${{ github.ref }}-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: ${{ inputs.release_sha == '' }}

jobs:
  lint:
    name: Lint Protos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Run buf lint
        uses: bufbuild/buf-lint-action@v1
        with:
          input: proto

      - name: Check buf format
        run: |
          if [[ $(buf format -d) ]]; then
            echo "❌ Proto files are not formatted. Run 'buf format -w' to fix."
            exit 1
          fi

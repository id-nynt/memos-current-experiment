# Two exact releases, one identical SQLite workload; no compatibility matrix.
name: SQLite experimental pipeline qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memos-release-qualification
  cancel-in-progress: false
jobs:
  qualify:
    name: Qualify (${{ matrix.release }}, sqlite)
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: v1
            sha: 2b5a8be2c2f9cf81599393a227890fb2424a5f03
          - release: v2
            sha: db695ea0d54cfce6925f07a4715cb42eb6fd8f20
    uses: ./.github/workflows/experiment-validation.yml
    with:
      release_sha: ${{ matrix.sha }}

name: SQLite candidate validation
on:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  validation:
    name: SQLite candidate validation
    runs-on: [self-hosted, linux, memos-bdi-deploy]
    steps:
      - name: Checkout exact control
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout frozen application
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          path: app
          persist-credentials: false
      - name: Setup Go once
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Setup pnpm once
        uses: pnpm/action-setup@v4.2.0
        with:
          version: '11.0.1'
      - name: Setup Node once
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run authoritative SQLite workload
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DRIVER: sqlite
        run: python3 control/experiment/ci_candidate.py --source app --release-sha "$RELEASE_SHA"

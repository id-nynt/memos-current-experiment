name: Experiment backend-tests

on:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-backend-tests-${{ github.ref }}-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: ${{ inputs.release_sha == '' }}

env:
  GO_VERSION: "1.27.0"

jobs:
  static-checks:
    name: Static Checks
    runs-on: [self-hosted, linux, memos-bdi-deploy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy -go=${{ env.GO_VERSION }}
          git diff --exit-code

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=3m

  tests:
    name: Tests (${{ matrix.test-group }})
    runs-on: [self-hosted, linux, memos-bdi-deploy]
    strategy:
      fail-fast: false
      matrix:
        test-group: [store, server, internal, other]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: |
          case "${{ matrix.test-group }}" in
            store)
              # Workload conservative-sqlite-v1: SQLite deployment, fresh tests on every attempt.
              DRIVER=sqlite go test -v -count=1 ./store/...
              ;;
            server)
              # Includes ./server/test, which boots the real server via
              # server.NewServer and smokes every router it mounts.
              go test -v -race -count=1 ./server/...
              ;;
            internal)
              go test -v -race -count=1 ./internal/...
              ;;
            other)
              go test -v -race -count=1 \
                ./cmd/... ./core/... ./markdown/... ./filter/... ./provider/... ./proto/...
              ;;
          esac
        env:
          DRIVER: sqlite
